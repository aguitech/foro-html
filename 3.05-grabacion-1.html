<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3.05 · Grabación Escena 1</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo"><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>BanCoppel</div>
      <div class="brand-divider"></div>
      <div class="brand-logo logo-atore"><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>Atore Coppel</div>
    </div>
    <div class="section-tag"><span class="claqueta">🎬</span> RODAJE · 3</div>
  </header>

  <main>
    <div class="screen">
      <div class="screen-inner">
        <div class="split">
          <div class="left">
            <div class="director-avatar">🎬</div>
          </div>

          <div>
            <span class="escena-tag">ESCENA 1 DE 3</span>

            <div style="margin-top:14px; display:flex; align-items:center; gap:14px;">
              <span class="rec-hud"><span class="dot"></span> GRABANDO</span>
              <span class="timer" id="timer" style="font-weight:800; color:var(--c-rojo-500); font-size:18px;">00:00:00</span>
            </div>

            <blockquote class="quote">"Primero planeo, después gasto."</blockquote>

            <div class="instr">Mantén tu mirada a cámara y continúa.</div>

            <div style="margin-top:24px;">
              <a class="btn btn-primary" href="3.06-clip-guardado.html">Detener y guardar</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <span class="pill"><span class="ico">🛡️</span> Tu información está protegida. Consulta el Aviso de privacidad.</span>
    <span class="pill"><span class="ico">💡</span> TIP DEL DIRECTOR — Tú eres el protagonista.</span>
  </footer>

  <script>
    const t = document.getElementById('timer');
    let s = 0;
    setInterval(() => {
      s++;
      const hh = String(Math.floor(s / 3600)).padStart(2, '0');
      const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      t.textContent = `${hh}:${mm}:${ss}`;
    }, 1000);
  </script>
</body>
</html>
